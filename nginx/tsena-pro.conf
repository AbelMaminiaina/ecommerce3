# Nginx de la démo « Tsena Pro » (HTTP, sans domaine). Écoute en interne sur 80 ; le port publié sur
# l'hôte est DEMO_PORT (docker-compose.demo.yml).
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Derriere le tunnel Cloudflare, le pair direct est un conteneur du reseau Docker : on recupere la
    # vraie adresse du visiteur dans X-Forwarded-For (sinon tous les visiteurs partageraient une IP et
    # la limitation de debit / des commandes invitees les traiterait comme un seul).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Protocole vu par le visiteur : https derriere le tunnel, sinon celui de la connexion (http)
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:3001;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Routes d'authentification du BACKEND (inscription, connexion, profil, et pour l'application mobile :
        # renouvellement de session et déconnexion) : elles partagent le préfixe /api/auth/ avec NextAuth,
        # donc listées explicitement (une regex l'emporte sur le préfixe)
        location ~ ^/api/auth/(login|register|register-company|me|refresh|logout)$ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Autres routes /api/auth/* (session, csrf, callback…) : NextAuth, géré par le frontend
        location /api/auth/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Application mobile à télécharger (APK Android), déposée dans /opt/tsena-pro/downloads sur le serveur
        location /telechargements/ {
            alias /usr/share/nginx/downloads/;
            types { application/vnd.android.package-archive apk; }
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API backend (le backend lit X-Forwarded-For : `trust proxy` = 1)
        # Photos des produits (fichiers du backend) : noms uniques, mis en cache un an par le navigateur et Cloudflare
        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 60s;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
